[package]
name = "agent-rewind"
version = "0.1.1"
edition = "2021"
authors = ["Buzburg AI <dev@buzburg.ai>"]
description = "Instant zero-overhead copy-on-write undo and time machine for AI coding agents."
license = "MIT"
repository = "https://github.com/Buzburg/agent-rewind"
keywords = ["ai-agent", "undo", "time-machine", "developer-tools", "checkpoint"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
walkdir = "2.5"
colored = "2.1"
similar = { version = "2.6", features = ["inline"] }

tempfile = "3.17"
